name: Generate jlFriCAS Documentation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@latest

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install sbcl libgmp-dev libxpm-dev cl-yason cl-alexandria
      - name: install Julia libraries
        run: |
          julia -e "import Pkg;Pkg.add([\"Nemo\", \"Suppressor\", \"SpecialFunctions\", \"DataFrames\", \"Latexify\", \"LaTeXStrings\", \"Statistics\"])"

      - name: configure
        run: ./configure --with-lisp=sbcl --with-gmp --enable-julia --enable-mcp --enable-mathlink  || cat config.log

      - name: make
        run: make -j4 --output-sync

      - name: install jlFriCAS
        run: sudo make install

      - name: Generate documentation for GitHub pages
        run: |
          python3 contrib/generate_jldocs.py --fricas-cmd fricas

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: jlfricas-docs
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
